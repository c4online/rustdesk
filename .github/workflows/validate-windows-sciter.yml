name: Validate Windows x86 (sciter)
on:
  workflow_dispatch:
jobs:
  validate-sciter-i686:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "15.0.6"
          directory: ${{ runner.temp }}/llvm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: i686-pc-windows-msvc
          components: "rustfmt"
      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          VCPKG_ROOT="$runner_temp/vcpkg"
          export VCPKG_ROOT
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          fi
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x86-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "----- vcpkg log: $_1 -----"; cat "$_1"; done
            exit 1
          fi
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
      - name: Build sciter 32bit
        shell: bash
        run: |
          python3 res/inline-sciter.py
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          # patch sciter-rs 移除stable不允许的feature属性
          SCITER_SRC=$(find ~/.cargo/git/checkouts/rust-sciter-* -name lib.rs -path "*/src/lib.rs" | head -1)
          sed -i '/#!\[feature(abi_thiscall)\]/d' $SCITER_SRC
          # 32位跨编译：加--target参数，产物路径指向target/i686目录
          cargo build --locked --features inline --release --bins --target i686-pc-windows-msvc
          echo "✅ 32位sciter编译验证通过"
